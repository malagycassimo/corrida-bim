version: "3.7"
services:
    database:
        image: prismagraphql/mongo-single-replica:4.4.3-bionic
        env_file: .env
        network_mode: host

    nginx:
        image: nginx:latest
        network_mode: host
        volumes:
            - ./conf.d:/etc/nginx/conf.d
        depends_on:
            - database

    client:
        build:
            context: client
            dockerfile: Dockerfile
        depends_on:
            - server
        env_file: .env
        network_mode: host

    server:
        build:
            context: participants
            dockerfile: Dockerfile
        depends_on:
            - database
        env_file: .env
        network_mode: host
